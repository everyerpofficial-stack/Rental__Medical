[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── HTTP Security Headers ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — disallow embedding in iframes
    X-Frame-Options = "DENY"

    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # Referrer information — only send origin on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Enforce HTTPS for 1 year (only takes effect on HTTPS deployments)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Restrict browser feature access
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"

    # Cross-Origin policies
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # Content Security Policy
    # - default-src 'self': Only load resources from own origin by default
    # - script-src 'self' 'unsafe-inline': React + Vite need inline scripts
    # - style-src 'self' 'unsafe-inline' fonts.googleapis.com: CSS + Google Fonts
    # - font-src 'self' fonts.gstatic.com: Google Fonts delivery
    # - connect-src 'self' script.google.com *.googleapis.com: GSheets API calls
    # - img-src 'self' data: blob:: SVG icons, base64 images, blob URLs for PDFs
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://script.google.com https://*.googleapis.com https://script.googleusercontent.com; img-src 'self' data: blob: https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
